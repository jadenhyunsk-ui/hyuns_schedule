<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이현 · 규현 주간 일정표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --paper:#FBF6EC;
    --paper-line:#E7DFCB;
    --ink:#33302A;
    --ink-soft:#6B6355;
    --teal:#4A7C74;
    --coral:#E0795F;
    --card-bg:#FFFFFF;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ overflow-x:hidden; }
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size:100% 42px;
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    padding-bottom:60px;
    overflow-x:hidden;
    width:100%;
  }

  header{ padding:28px 20px 14px; text-align:center; position:relative; }
  .logout-corner{
    position:absolute; top:12px; right:12px; font-size:11px; font-weight:600;
    padding:5px 12px; border:none; background:rgba(74,124,116,.1); color:var(--teal);
    box-shadow:none;
  }
  .logout-corner:hover{ background:var(--teal); color:#fff; transform:none; box-shadow:none; }
  header .eyebrow{
    font-family:'Noto Sans KR', sans-serif; font-size:14px; color:var(--teal); letter-spacing:.08em;
    margin-bottom:4px; display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap;
    cursor:default;
  }
  .eyebrow-select{
    font-family:'Noto Sans KR', sans-serif;
    font-size:14px;
    color:var(--teal);
    background:rgba(74,124,116,.08);
    border:none;
    box-shadow:0 0 0 1.5px dashed rgba(74,124,116,.45);
    border-radius:6px;
    padding:1px 4px;
    cursor:pointer;
  }
  header h1{
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:clamp(24px, 7vw, 34px);
    line-height:1.2; margin:0; color:var(--ink);
    word-break:keep-all; overflow-wrap:break-word;
    border-radius:8px; padding:2px 4px;
  }
  header p{ margin:6px 0 0; font-size:12.5px; color:var(--ink-soft); border-radius:6px; padding:2px 4px; }

  /* ---- 더블클릭(더블탭)으로 바로 수정되는 공통 필드 (수정모드에서만 편집 힌트 표시) ---- */
  .ed-field{ border-radius:4px; }
  body.edit-mode .ed-field{ cursor:text; }
  body.edit-mode .ed-field:hover{ background:rgba(74,124,116,.07); }
  .ed-field[contenteditable="true"]{
    outline:none;
    background:rgba(74,124,116,.14);
    box-shadow:0 0 0 1.5px dashed rgba(74,124,116,.5);
  }
  .ed-field:empty::before{ content:attr(data-placeholder); opacity:.42; pointer-events:none; }

  .top-bar{
    margin:14px auto 0;
    max-width:640px;
    padding:0 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .sync-pill{ font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .top-bar-actions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:100%; }
  .btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:6px 10px;
    border-radius:20px;
    border:2px solid var(--paper-line);
    background:var(--card-bg);
    color:var(--ink-soft);
    cursor:pointer;
    box-shadow:0 1px 3px rgba(51,48,42,.06);
    transition:all .15s ease;
  }
  .btn:hover{ border-color:var(--teal); color:var(--teal); transform:translateY(-1px); box-shadow:0 3px 8px rgba(51,48,42,.1); }
  .btn.ghost{ background:transparent; box-shadow:none; }
  .btn.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn.active:hover{ color:#fff; }

  .save-toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:12.5px; padding:8px 16px; border-radius:20px;
    opacity:0; transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .save-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- 이전 일정(스냅샷) 모달 ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(51,48,42,.45); z-index:90;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background:var(--card-bg); border-radius:16px; width:100%; max-width:360px;
    max-height:80vh; display:flex; flex-direction:column; box-shadow:0 8px 28px rgba(0,0,0,.25);
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    border-bottom:1px solid var(--paper-line); flex-shrink:0;
  }
  .modal-header h3{ margin:0; font-size:16px; color:var(--ink); }
  .modal-close{
    border:none; background:transparent; font-size:20px; line-height:1; color:var(--ink-soft); cursor:pointer;
    padding:2px 6px;
  }
  .modal-close:hover{ color:var(--coral); }
  .modal-body{ padding:12px 16px; overflow-y:auto; }
  .snap-empty{ font-size:12.5px; color:var(--ink-soft); text-align:center; padding:20px 4px; line-height:1.6; }
  .snap-item{
    display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px dashed var(--paper-line);
  }
  .snap-item:last-child{ border-bottom:none; }
  .snap-info{ flex:1; min-width:0; }
  .snap-title{ font-size:13.5px; font-weight:700; color:var(--ink); word-break:break-all; }
  .snap-date{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .snap-load-btn{
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:16px; border:2px solid var(--paper-line);
    background:var(--card-bg); color:var(--teal); cursor:pointer; flex-shrink:0;
  }
  .snap-load-btn:hover{ border-color:var(--teal); }

  .tabs{ display:flex; gap:6px; max-width:640px; margin:14px auto 0; padding:0 16px; overflow-x:auto; }
  .tab{
    flex:1; text-align:center; padding:10px 4px; font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:clamp(14px, 4vw, 18px);
    border-radius:14px 14px 0 0; background:#EFE7D4; color:var(--ink-soft); cursor:pointer;
    border:2px solid transparent; border-bottom:none; transition:all .18s ease; user-select:none;
    white-space:nowrap;
  }
  .tab:hover{ background:#F3ECDC; }
  .tab.active{ background:var(--card-bg); color:var(--teal); border-color:var(--paper-line); box-shadow:0 -2px 6px rgba(51,48,42,.04); }

  main{ max-width:640px; margin:0 auto; padding:0 16px 8px; }

  .day-panel{
    display:none; background:var(--card-bg); border:2px solid var(--paper-line); border-radius:0 16px 16px 16px;
    padding:16px; box-shadow:0 4px 16px rgba(51,48,42,.06); animation:fade .25s ease;
  }
  .day-panel.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .kid-col h2{
    font-family:'Noto Sans KR', sans-serif; font-size:clamp(16px, 4.4vw, 19px);
    margin:0 0 2px; text-align:center; color:var(--ink);
  }
  .school-badge{
    display:block; text-align:center; font-size:11px; line-height:1.35; color:var(--ink-soft); margin-bottom:4px;
  }

  /* ---- 시간 세로줄 그리드 ---- */
  .time-grid{
    display:grid;
    grid-template-columns:36px minmax(0,1fr) minmax(0,1fr);
    max-width:100%;
    border:1px solid var(--paper-line);
    border-radius:10px;
    overflow:hidden;
    background:#FBF8F1;
  }
  .tg-corner{ background:#F5F0E3; border-bottom:2px solid var(--paper-line); }
  .kid-col.tg-kid-head{
    grid-row:1; background:#F5F0E3; border-bottom:2px solid var(--paper-line);
    border-left:1px solid var(--paper-line); padding:8px 4px 6px;
  }
  .time-col-cell{
    font-size:9.5px; color:var(--ink-soft); text-align:right; padding:2px 4px 0 0;
    border-top:1px dashed var(--paper-line); white-space:nowrap;
  }
  .tg-cell-empty{
    border-top:1px dashed var(--paper-line); border-left:1px solid var(--paper-line); cursor:copy;
  }
  .tg-cell-empty:hover{ background:rgba(74,124,116,.1); }

  .tg-event{
    position:relative; margin:1px 2px; border-radius:8px; padding:10px 6px 10px 12px;
    font-size:11.5px; line-height:1.3; min-width:0;
    box-shadow:0 1px 2px rgba(51,48,42,.1);
  }
  .tg-event-head{ display:flex; align-items:center; gap:4px; min-width:0; }
  .tg-event .time{ font-size:10px; font-weight:700; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .tg-event .name{ font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:13px; line-height:1.22; margin:1px 0; word-break:break-word; }
  .tg-event .meta{ font-size:9.5px; line-height:1.25; opacity:.85; word-break:break-word; }
  .tg-event.compact .name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tg-event.compact .meta{ display:none; }
  .tg-event .ed-field:empty::before{ opacity:.6; }

  .cat-dot{
    display:inline-block; width:10px; height:10px; border-radius:50%; cursor:pointer; flex-shrink:0;
    box-shadow:0 0 0 1px rgba(0,0,0,.35);
  }
  .cat-picker{
    position:fixed; z-index:200; background:#fff; border:1px solid var(--paper-line); border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.18); padding:6px; max-height:280px; overflow-y:auto; min-width:160px;
  }
  .cat-picker-row{ display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--ink); }
  .cat-picker-row:hover{ background:#F3ECDC; }
  .cat-picker-row.active{ background:#EAF1EF; font-weight:700; }
  .cat-picker-row i{ width:12px; height:12px; border-radius:4px; flex-shrink:0; display:inline-block; }

  /* ---- 수정모드: 일정 조절(위/아래 작은 손잡이) & 이동(길게 누르기) ---- */
  .tg-handle{
    position:absolute; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background:#fff; border:2px solid var(--teal); box-shadow:0 1px 3px rgba(0,0,0,.25);
    cursor:ns-resize; touch-action:none; z-index:3;
  }
  .tg-handle-top{ top:-8px; }
  .tg-handle-bottom{ bottom:-8px; }
  body.edit-mode .tg-event{ cursor:grab; }
  .tg-event{ -webkit-touch-callout:none; }
  .tg-event.dragging{ cursor:grabbing; opacity:.85; }

  /* ---- 삭제 × 버튼 (수정모드에서만 생성됨) ---- */
  .del-x{
    border:none; background:rgba(224,121,95,.16); color:var(--coral);
    width:18px; height:18px; border-radius:50%; font-size:13px; line-height:1; font-weight:700;
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .del-x:hover{ background:rgba(224,121,95,.32); }
  .tg-event .del-x{ position:absolute; top:3px; right:3px; z-index:3; }

  /* ---- 카테고리(범례) 관리 ---- */
  .legend{ max-width:640px; margin:22px auto 0; padding:0 16px; display:flex; flex-wrap:wrap; gap:7px 9px; align-items:center; }
  .cat-chip{
    display:flex; align-items:center; gap:5px; font-size:11.5px; line-height:1.4; color:var(--ink-soft);
    background:#F4EFE1; border-radius:20px; padding:3px 8px 3px 5px; -webkit-touch-callout:none;
  }
  .cat-label{
    width:10em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cat-color{ width:16px; height:16px; padding:0; border:1px solid rgba(0,0,0,.2); border-radius:50%; cursor:pointer; }
  .cat-color:disabled{ cursor:default; }

  /* ---- 색상 선택 팝업 (프리셋 / 사용자화 원형 색상표) ---- */
  .color-popup{
    position:fixed; z-index:200; background:#fff; border:1px solid var(--paper-line); border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.18); padding:10px; width:210px;
  }
  .color-popup-tabs{ display:flex; gap:4px; margin-bottom:8px; }
  .color-tab{
    flex:1; font-size:12px; font-weight:600; padding:6px 4px; border-radius:8px; border:none;
    background:#F3ECDC; color:var(--ink-soft); cursor:pointer;
  }
  .color-tab.active{ background:var(--teal); color:#fff; }
  .color-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
  .color-swatch{
    position:relative; width:100%; aspect-ratio:1; border-radius:50%; border:1px solid rgba(0,0,0,.12);
    cursor:pointer; padding:0;
  }
  .color-swatch-check{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#33302A; font-size:13px; font-weight:700; text-shadow:0 0 3px rgba(255,255,255,.9);
  }
  .color-wheel-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .color-wheel-box{ position:relative; }
  .color-wheel-canvas{ border-radius:50%; touch-action:none; display:block; }
  .color-wheel-cursor{
    position:absolute; width:14px; height:14px; border-radius:50%; border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.35); transform:translate(-50%,-50%); pointer-events:none;
  }
  .color-wheel-light{ width:100%; accent-color:var(--teal); }
  .color-preview-row{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .color-preview{ width:22px; height:22px; border-radius:50%; border:1px solid rgba(0,0,0,.15); flex-shrink:0; }
  .color-hex{ font-size:12px; color:var(--ink-soft); }
  .color-apply-btn{
    display:block; width:100%; margin-top:8px; padding:7px; border-radius:8px; border:none;
    background:var(--teal); color:#fff; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .cat-add, .add-row-btn, .add-item-btn{
    font-size:11.5px; color:var(--ink-soft); background:transparent; border:2px dashed var(--paper-line);
    border-radius:20px; padding:5px 12px; cursor:pointer;
  }
  .cat-add:hover, .add-row-btn:hover, .add-item-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .add-row-btn, .add-item-btn{ display:block; width:100%; margin-top:8px; border-radius:8px; text-align:center; padding:7px; }

  /* ---- 선생님 연락처 / 학원비 탭 ---- */
  .info-panel{ display:flex; flex-direction:column; gap:16px; }
  .fee-table-wrap{ position:relative; -webkit-touch-callout:none; }
  .fee-table-scroll{ border-radius:10px; border:1px solid var(--paper-line); }
  .fee-table{ width:100%; table-layout:fixed; border-collapse:collapse; font-size:11px; }
  .fee-table th, .fee-table td{
    border:1px solid var(--paper-line); padding:4px 2px; text-align:center;
    word-break:break-all; overflow-wrap:break-word;
  }
  .phone-cell{ cursor:pointer; color:var(--teal); font-weight:600; }
  .phone-cell:hover{ text-decoration:underline; }
  .fee-table th{ background:#F5F0E3; font-weight:700; font-size:9.5px; line-height:1.25; cursor:pointer; }
  .fee-table th:hover{ background:#F0E6CC; }

  /* 학원비 표는 줄바꿈 없이 가로 스크롤로 보여준다 (연락처 표는 위의 고정폭/줄바꿈 유지) */
  .fee-table-scroll--fees{ overflow-x:auto; }
  .fee-table--fees{ width:auto; min-width:100%; table-layout:auto; }
  .fee-table--fees th, .fee-table--fees td{ white-space:nowrap; word-break:normal; padding:5px 8px; }
  .fee-total-row td{ font-weight:700; background:#FAF6EB; }

  /* ---- 숙제 체크리스트 ---- */
  .hw-wrap{ max-width:640px; margin:18px auto 0; padding:0 16px; }
  .hw-card{ background:var(--card-bg); border:2px solid var(--paper-line); border-radius:16px; padding:14px 16px; box-shadow:0 4px 16px rgba(51,48,42,.06); }
  .hw-card h3{ font-family:'Noto Sans KR', sans-serif; margin:0 0 8px; font-size:17px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .hw-card h3 small{ font-size:11px; color:var(--ink-soft); font-weight:400; font-family:'Noto Sans KR', sans-serif; }
  .hw-kids{ display:flex; gap:14px; }
  .hw-kid-col{ flex:1; min-width:0; }
  .hw-kid-heading{ font-weight:700; font-size:13px; color:var(--teal); text-align:center; margin-bottom:4px; }
  .hw-item{ display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px dashed var(--paper-line); -webkit-touch-callout:none; }
  .hw-item:last-of-type{ border-bottom:none; }
  .hw-check{
    width:17px; height:17px; flex-shrink:0; border-radius:5px; border:2px solid var(--paper-line);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; background:#fff; user-select:none;
  }
  .hw-check.checked{ background:var(--teal); border-color:var(--teal); }
  .hw-text{ flex:1; font-size:13px; min-width:0; }
  .hw-item.done .hw-text{ text-decoration:line-through; opacity:.5; }
  .hw-add{ display:block; width:100%; margin-top:8px; padding:7px; border-radius:8px; border:2px dashed var(--paper-line); background:transparent; color:var(--ink-soft); font-size:12px; cursor:pointer; }
  .hw-add:hover{ border-color:var(--teal); color:var(--teal); }

  footer{ text-align:center; margin-top:22px; padding:0 20px; font-size:11.5px; line-height:1.6; color:var(--ink-soft); }

  @media (max-width:480px){
    .top-bar{ padding:0 10px; gap:6px; }
    .btn{ font-size:10.5px; padding:5px 8px; }
    main, .legend, .hw-wrap{ padding-left:10px; padding-right:10px; }
    header{ padding:22px 12px 12px; }
    .time-grid{ grid-template-columns:32px minmax(0,1fr) minmax(0,1fr); }
    .tg-event{ padding:8px 4px 8px 10px; font-size:10.5px; }
    .tg-event .name{ font-size:11.5px; }
    .tg-event .meta{ font-size:8.5px; }
    .tg-event .time{ font-size:9px; }
    .school-badge{ font-size:10px; }
    .legend span, footer{ font-size:10.5px; }
    .fee-table{ font-size:9.5px; }
    .fee-table th, .fee-table td{ padding:3px 1px; }
    .fee-table th{ font-size:8.5px; }
    .hw-kids{ gap:8px; }
    .cat-chip{ font-size:10.5px; }
  }
  @media (max-width:360px){
    .time-grid{ grid-template-columns:30px minmax(0,1fr) minmax(0,1fr); }
    .tg-event{ padding:7px 3px 7px 8px; font-size:10px; }
    .tg-event .name{ font-size:11px; }
  }

  /* ---- 로그인 ---- */
  .login-overlay{
    position:fixed; inset:0; background:var(--paper); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:var(--card-bg); border:2px solid var(--paper-line); border-radius:16px;
    padding:28px 24px; width:100%; max-width:320px; box-shadow:0 4px 16px rgba(51,48,42,.08);
  }
  .login-card h2{ font-family:'Noto Sans KR', sans-serif; font-size:22px; margin:0 0 4px; text-align:center; color:var(--ink); }
  .login-card p{ margin:0 0 18px; font-size:12px; color:var(--ink-soft); text-align:center; }
  .login-field{ margin-bottom:12px; }
  .login-field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .login-field input{
    width:100%; padding:9px 10px; border-radius:8px; border:1.5px solid var(--paper-line);
    font-size:14px; font-family:'Noto Sans KR', sans-serif; box-sizing:border-box;
  }
  .login-field input:focus{ outline:none; border-color:var(--teal); }
  .login-submit{
    width:100%; padding:10px; border-radius:20px; border:none; background:var(--teal); color:#fff;
    font-weight:600; font-size:13.5px; cursor:pointer; margin-top:4px;
  }
  .login-submit:disabled{ opacity:.6; cursor:default; }
  .login-error{ color:var(--coral); font-size:12px; margin-top:10px; text-align:center; min-height:14px; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>이현 · 규현 일정표</h2>
    <p>가족 로그인 후 이용할 수 있어요</p>
    <form id="loginForm">
      <div class="login-field">
        <label for="loginEmail">이메일</label>
        <input type="email" id="loginEmail" required autocomplete="username">

/* ===== 더블클릭(더블탭)으로 바로 수정되는 공통 헬퍼 ===== */
function placeCaretAtEnd(el){
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
function makeDblClickEditable(el, placeholder, onCommit){
  el.classList.add('ed-field');
  if(placeholder) el.setAttribute('data-placeholder', placeholder);
  el.addEventListener('dblclick', (e)=>{
    if(!editMode) return;
    e.stopPropagation();
    el.contentEditable = 'true';
    el.focus();
    placeCaretAtEnd(el);
  });
  el.addEventListener('input', ()=>{ if(onCommit) onCommit(el.textContent); });
  el.addEventListener('blur', ()=>{ el.contentEditable = 'false'; });
  el.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); el.blur(); }
    else if(e.key==='Escape'){ el.blur(); }
  });
}

function hexToRgb(hex){
  let h = (hex||'#D9D3C6').replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const num = parseInt(h,16) || 0xD9D3C6;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function relLuminance(hex){
  const {r,g,b} = hexToRgb(hex);
  const lin = v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function textColorFor(hex){
  try{ return relLuminance(hex) > 0.55 ? '#33302A' : '#FFFFFF'; }catch(e){ return '#33302A'; }
}

/* ===== HSL 원형 색상표 ===== */
function hslToRgb(h, s, l){
  h = ((h % 360) + 360) % 360; s = clamp(s,0,100)/100; l = clamp(l,0,100)/100;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c/2;
  let r=0,g=0,b=0;
  if(h<60){ r=c; g=x; b=0; }
  else if(h<120){ r=x; g=c; b=0; }
  else if(h<180){ r=0; g=c; b=x; }
  else if(h<240){ r=0; g=x; b=c; }
  else if(h<300){ r=x; g=0; b=c; }
  else { r=c; g=0; b=x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=> clamp(v,0,255).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function hexToHsl(hex){
  const {r,g,b} = hexToRgb(hex);
  const rn=r/255, gn=g/255, bn=b/255;
  const max=Math.max(rn,gn,bn), min=Math.min(rn,gn,bn);
  let h=0; const l=(max+min)/2; let s=0;
  const d=max-min;
  if(d!==0){
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    if(max===rn) h = (gn-bn)/d + (gn<bn?6:0);
    else if(max===gn) h = (bn-rn)/d + 2;
    else h = (rn-gn)/d + 4;
    h *= 60;
  }
  return { h, s:s*100, l:l*100 };
}

function buildColorWheel(initialHex, onChange){
  const SIZE = 176;
  const wrap = document.createElement('div');
  wrap.className = 'color-wheel-wrap';

  const wheelBox = document.createElement('div');
  wheelBox.className = 'color-wheel-box';
  wheelBox.style.width = SIZE+'px';
  wheelBox.style.height = SIZE+'px';
  const canvas = document.createElement('canvas');
  canvas.width = SIZE; canvas.height = SIZE;
  canvas.className = 'color-wheel-canvas';
  const cursor = document.createElement('div');
  cursor.className = 'color-wheel-cursor';
  wheelBox.appendChild(canvas);
  wheelBox.appendChild(cursor);

  const lightSlider = document.createElement('input');
  lightSlider.type = 'range'; lightSlider.min = '10'; lightSlider.max = '95';
  lightSlider.className = 'color-wheel-light';

  let hsl = hexToHsl(initialHex);
  if(hsl.s < 2) hsl.s = 40;
  lightSlider.value = String(Math.round(hsl.l));

  const ctx = canvas.getContext('2d');
  function drawWheel(){
    const img = ctx.createImageData(SIZE, SIZE);
    const cx = SIZE/2, cy = SIZE/2, R = SIZE/2;
    for(let y=0; y<SIZE; y++){
      for(let x=0; x<SIZE; x++){
        const dx = x-cx, dy = y-cy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const i = (y*SIZE+x)*4;
        if(dist>R){ img.data[i+3]=0; continue; }
        let angle = Math.atan2(dy,dx) * 180/Math.PI;
        angle = (angle+360)%360;
        const sat = Math.min(100, dist/R*100);
        const [r,g,b] = hslToRgb(angle, sat, hsl.l);
        img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  function updateCursor(){
    const cx = SIZE/2, cy = SIZE/2, R = SIZE/2;
    const rad = hsl.h * Math.PI/180;
    const dist = (hsl.s/100)*R;
    cursor.style.left = (cx + Math.cos(rad)*dist) + 'px';
    cursor.style.top = (cy + Math.sin(rad)*dist) + 'px';
    const [r,g,b] = hslToRgb(hsl.h, hsl.s, hsl.l);
    cursor.style.background = rgbToHex(r,g,b);
  }
  function emit(){
    const [r,g,b] = hslToRgb(hsl.h, hsl.s, hsl.l);
    onChange(rgbToHex(r,g,b));
  }
  function pickAt(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;
    const cx = SIZE/2, cy = SIZE/2, R = SIZE/2;
    const dx = x-cx, dy = y-cy;
    let dist = Math.sqrt(dx*dx+dy*dy);
    let angle = Math.atan2(dy,dx) * 180/Math.PI; angle = (angle+360)%360;
    if(dist>R) dist = R;
    hsl.h = angle; hsl.s = (dist/R)*100;
    updateCursor();
    emit();
  }
  let dragging = false;
  canvas.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    pickAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', (e)=>{ if(dragging) pickAt(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', ()=>{ dragging = false; });
  lightSlider.addEventListener('pointerdown', (e)=> e.stopPropagation());
  lightSlider.addEventListener('input', ()=>{
    hsl.l = Number(lightSlider.value);
    drawWheel();
    updateCursor();
    emit();
  });

  drawWheel();
  updateCursor();

  wrap.appendChild(wheelBox);
  wrap.appendChild(lightSlider);
  return wrap;
}

    presetTab.classList.add('active'); customTab.classList.remove('active');
    body.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'color-grid';
    PASTEL_PALETTE.forEach(hex=>{
      const sw = document.createElement('button');
      sw.type = 'button';
      const isSel = hex.toUpperCase() === (currentColor||'').toUpperCase();
      sw.className = 'color-swatch' + (isSel ? ' selected' : '');
      sw.style.background = hex;
      if(isSel){
        const check = document.createElement('span');
        check.className = 'color-swatch-check';
        check.textContent = '✓';
        sw.appendChild(check);
      }
      /* 짧게 클릭하면 바로 선택, 길게 누르면 원형 색상표로 넘어가 그 색을 세밀 조정 */
      let pressTimer = null, pStartX = 0, pStartY = 0, longPressFired = false;
      const THRESHOLD = 450, TOLERANCE = 8;
      const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
      sw.addEventListener('pointerdown', (e)=>{
        pStartX = e.clientX; pStartY = e.clientY; longPressFired = false;
        cancelPress();
        pressTimer = setTimeout(()=>{
          pressTimer = null;
          longPressFired = true;
          showCustom(hex);
        }, THRESHOLD);
      });
      sw.addEventListener('pointermove', (e)=>{
        if(!pressTimer) return;
        if(Math.abs(e.clientX-pStartX)>TOLERANCE || Math.abs(e.clientY-pStartY)>TOLERANCE) cancelPress();
      });
      sw.addEventListener('pointerup', cancelPress);
      sw.addEventListener('pointerleave', cancelPress);
      sw.addEventListener('pointercancel', cancelPress);
      sw.addEventListener('contextmenu', (e)=> e.preventDefault());
      sw.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(longPressFired){ longPressFired = false; return; }
        onPick(hex); closeColorPopup();
      });
      grid.appendChild(sw);
    });
    body.appendChild(grid);
  }
  function showCustom(startHex){
    presetTab.classList.remove('active'); customTab.classList.add('active');
    const initHex = startHex || currentColor;
    body.innerHTML = '';
    let pending = initHex;
    const previewRow = document.createElement('div');

    const preview = document.createElement('span');
    preview.className = 'color-preview';
    preview.style.background = initHex;
    const hexOut = document.createElement('span');
    hexOut.className = 'color-hex';
    hexOut.textContent = initHex;
    previewRow.appendChild(preview);
    previewRow.appendChild(hexOut);

    const wheel = buildColorWheel(initHex, (hex)=>{
      pending = hex;
      preview.style.background = hex;
      hexOut.textContent = hex;
    });
    body.appendChild(wheel);
    body.appendChild(previewRow);

    const applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.className = 'color-apply-btn';
    applyBtn.textContent = '적용';
    applyBtn.addEventListener('click', (e)=>{ e.stopPropagation(); onPick(pending); closeColorPopup(); });
    body.appendChild(applyBtn);
  }
  presetTab.addEventListener('click', (e)=>{ e.stopPropagation(); showPreset(); });
  customTab.addEventListener('click', (e)=>{ e.stopPropagation(); showCustom(); });

  pop.appendChild(tabs);
  pop.appendChild(body);
  document.body.appendChild(pop);
  showPreset();

  const r = anchorEl.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.top = Math.max(8, Math.min(r.bottom+4, window.innerHeight-ph-8)) + 'px';
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth-pw-8)) + 'px';
  currentColorPopup = pop;
  setTimeout(()=> document.addEventListener('click', closeColorPopupOnOutsideClick, true), 0);
}

const LOCAL_KEY = "family-schedule-state-v2";
async function loadLocalState(){
  try{
    const res = await window.storage.get(LOCAL_KEY, false);
    if(res && res.value){
      const s = JSON.parse(res.value);
      DATA = s.data || deepClone(DEFAULT_DATA);
      CONTACTS = s.contacts || deepClone(DEFAULT_CONTACTS);
      FEES = s.fees || deepClone(DEFAULT_FEES);
      CATEGORIES = s.categories || deepClone(DEFAULT_CATEGORIES);
      HOMEWORK = s.homework || deepClone(DEFAULT_HOMEWORK);
      SNAPSHOTS = s.snapshots || deepClone(DEFAULT_SNAPSHOTS);
      if(s.title){
        TITLE = s.title.title || DEFAULT_TITLE;
        SUBTITLE = s.title.subtitle || DEFAULT_SUBTITLE;
        YEAR = s.title.year || DEFAULT_YEAR;
        TERM = TERM_OPTIONS.includes(s.title.term) ? s.title.term : DEFAULT_TERM;
      }
      return;
    }
  }catch(e){ /* key not found or storage unavailable */ }
  DATA = deepClone(DEFAULT_DATA);
  CONTACTS = deepClone(DEFAULT_CONTACTS);
  FEES = deepClone(DEFAULT_FEES);
  CATEGORIES = deepClone(DEFAULT_CATEGORIES);
  HOMEWORK = deepClone(DEFAULT_HOMEWORK);
  SNAPSHOTS = deepClone(DEFAULT_SNAPSHOTS);
}

function fbInit(){
  try{

    fbRef.on('value', onFbValue, function(err){ fbStatus='error'; console.error('firebase', err); updateSyncPill(); });
  }catch(e){ console.error(e); fbStatus='error'; updateSyncPill(); }

function onFbValue(snap){
  const remote = snap.val();
  fbStatus = 'synced';
  if(!remote){
    fbRef.set({
      data:DATA, contacts:CONTACTS, fees:FEES, categories:CATEGORIES, homework:HOMEWORK, snapshots:SNAPSHOTS,
      title:{title:TITLE, subtitle:SUBTITLE, year:YEAR, term:TERM}
    }).catch(e=>console.error(e));
    updateSyncPill();
    return;
  }
  let changed = false;
  if(!fbWriteTimers.data && remote.data && JSON.stringify(remote.data)!==JSON.stringify(DATA)){ DATA=remote.data; changed=true; }
  if(!fbWriteTimers.contacts && remote.contacts && JSON.stringify(remote.contacts)!==JSON.stringify(CONTACTS)){ CONTACTS=remote.contacts; changed=true; }
  if(!fbWriteTimers.fees && remote.fees && JSON.stringify(remote.fees)!==JSON.stringify(FEES)){ FEES=remote.fees; changed=true; }
  if(!fbWriteTimers.categories && remote.categories && JSON.stringify(remote.categories)!==JSON.stringify(CATEGORIES)){ CATEGORIES=remote.categories; changed=true; }
  if(!fbWriteTimers.homework && remote.homework && JSON.stringify(remote.homework)!==JSON.stringify(HOMEWORK)){ HOMEWORK=remote.homework; changed=true; }
  if(!fbWriteTimers.snapshots && remote.snapshots && JSON.stringify(remote.snapshots)!==JSON.stringify(SNAPSHOTS)){ SNAPSHOTS=remote.snapshots; changed=true; }
  if(!fbWriteTimers.title && remote.title){
    const t = remote.title;
    if(t.title!==TITLE || t.subtitle!==SUBTITLE || t.year!==YEAR || t.term!==TERM){
      TITLE = t.title || DEFAULT_TITLE;
      SUBTITLE = t.subtitle || DEFAULT_SUBTITLE;
      YEAR = t.year || DEFAULT_YEAR;
      TERM = TERM_OPTIONS.includes(t.term) ? t.term : DEFAULT_TERM;
      changed = true;
    }
  }
  if(changed){
    ensureHomeworkWeek();
    normalizeSnapshots();
    scheduleLocalSave();
    if(isEditableFocus()){ pendingRerender = true; }
    else { rerenderNow(); }
  }
  updateSyncPill();
}
function fbQueueSync(key){
  if(!fbRef) return;
  if(fbWriteTimers[key]) clearTimeout(fbWriteTimers[key]);
  fbWriteTimers[key] = setTimeout(()=>{
    const getters = {
      data: ()=>DATA, contacts: ()=>CONTACTS, fees: ()=>FEES,
      categories: ()=>CATEGORIES, homework: ()=>HOMEWORK, snapshots: ()=>SNAPSHOTS,
      title: ()=>({title:TITLE, subtitle:SUBTITLE, year:YEAR, term:TERM})
    };
    if(!getters[key]){ delete fbWriteTimers[key]; return; }
    fbRef.child(key).set(getters[key]())
      .then(()=>{ delete fbWriteTimers[key]; })
      .catch(e=>{
        delete fbWriteTimers[key];
        console.error('fb sync', e);
        showToast('저장 실패: 로그인 권한을 확인해주세요');
      });
  }, 500);
}

const POINT_LABELS = ["12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00",
  "16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","22:00"];
function toMin(s){ const [h,m] = s.split(':').map(Number); return h*60+m; }
const POINTS = POINT_LABELS.map(toMin);
const N_ROWS = POINTS.length - 1;
const ROW_H = 36;

function parseTimeRange(ev){
  if(ev.time && ev.time.includes('~')){
    const [a,b] = ev.time.split('~').map(s=>s.trim());
    if(a && b) return [toMin(a), toMin(b)];
  }
  const m = (ev.meta||'').match(/승차\s*(\d{1,2}):(\d{2}).*?하차\s*(\d{1,2}):(\d{2})/);
  if(m){
    let h1=+m[1], m1=+m[2], h2=+m[3], m2=+m[4];
    if(h1<8) h1+=12;
    if(h2<8) h2+=12;
    return [h1*60+m1, h2*60+m2];
  }
  return null;
}
function snapStart(min){
  let idx = 0;
  for(let i=0;i<POINTS.length-1;i++){ if(POINTS[i]<=min) idx=i; }
  return idx;
}
function snapEnd(min){
  for(let i=0;i<POINTS.length;i++){ if(POINTS[i]>=min) return i; }
  return N_ROWS;
}
function joinTime(start, end){
  if(!start && !end) return '';
  if(start && end) return `${start} ~ ${end}`;
  return start || end;
}
function labelFromRows(sRow, eRow){
  return `${POINT_LABELS[sRow]} ~ ${POINT_LABELS[Math.min(eRow, N_ROWS)]}`;
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

/* ---- 세부 일정표 전용: 세로축은 30분(기존 POINT_LABELS) 단위를 유지하되,
   드래그로 시작/종료 시간을 옮길 때는 10분 단위로 스냅되도록 각 30분 칸을
   내부적으로 10분 단위 세부 행으로 쪼갠다. 엑셀 내보내기는 기존 30분 단위(N_ROWS 등)를 그대로 사용. ---- */
const FINE_STEP = 10;
const RANGE_START = POINTS[0];
const FINE_BLOCK_START = [];
const FINE_BLOCK_END = [];
const FINE_ROW_HEIGHTS = [];
(function buildFineGrid(){
  let acc = 0;
  for(let b=0; b<POINTS.length-1; b++){
    const dur = POINTS[b+1] - POINTS[b];
    const n = Math.round(dur / FINE_STEP);
    FINE_BLOCK_START.push(acc);
    const h = ROW_H / n;
    for(let k=0;k<n;k++) FINE_ROW_HEIGHTS.push(h);
    acc += n;
    FINE_BLOCK_END.push(acc);
  }
})();
const N_FINE_ROWS = FINE_ROW_HEIGHTS.length;
const FINE_CUM_Y = [0];
FINE_ROW_HEIGHTS.forEach(h=> FINE_CUM_Y.push(FINE_CUM_Y[FINE_CUM_Y.length-1] + h));

function fineRowToMin(fr){ return RANGE_START + fr * FINE_STEP; }
function fineSnap(min){ return clamp(Math.round((min - RANGE_START) / FINE_STEP), 0, N_FINE_ROWS); }
function fineLabel(fr){
  const min = Math.round(fineRowToMin(fr));
  return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
}
function fineRowToPx(fr){
  const i = Math.max(0, Math.min(N_FINE_ROWS-1, Math.floor(fr)));
  const frac = fr - i;
  return FINE_CUM_Y[i] + frac*(FINE_CUM_Y[i+1]-FINE_CUM_Y[i]);
}
function pxToFineRow(px){
  if(px<=0) return 0;
  if(px>=FINE_CUM_Y[N_FINE_ROWS]) return N_FINE_ROWS;
  for(let i=0;i<N_FINE_ROWS;i++){
    if(px <= FINE_CUM_Y[i+1]) return i + (px-FINE_CUM_Y[i])/(FINE_CUM_Y[i+1]-FINE_CUM_Y[i]);
  }
  return N_FINE_ROWS;
}

function buildDayGrid(day){
  const wrap = document.createElement('div');
  wrap.className = 'time-grid';
  wrap.style.gridTemplateRows = `auto ${FINE_ROW_HEIGHTS.map(h=>`${h}px`).join(' ')}`;

  const corner = document.createElement('div');
  corner.className = 'tg-corner';
  corner.style.gridColumn = '1';
  corner.style.gridRow = '1';
  wrap.appendChild(corner);

  ['이현','규현'].forEach((kid, ki)=>{
    const info = DATA[day][kid];
    const colNum = ki + 2;

    const head = document.createElement('div');
    head.className = 'kid-col tg-kid-head';
    head.style.gridColumn = String(colNum);
    const h2 = document.createElement('h2');
    h2.textContent = kid;
    head.appendChild(h2);
    const badge = document.createElement('div');
    badge.className = 'school-badge';
    badge.textContent = info.school;
    makeDblClickEditable(badge, '하교시간', (val)=>{ info.school = val; markDirty('data'); });
    head.appendChild(badge);
    wrap.appendChild(head);

    const placed = info.events.map((ev, idx)=>{
      const rng = parseTimeRange(ev);
      let sRow, eRow;
      if(rng){ sRow = fineSnap(rng[0]); eRow = fineSnap(rng[1]); }
      else { sRow = 0; eRow = 3; }
      if(eRow <= sRow) eRow = sRow + 1;
      sRow = Math.max(0, Math.min(sRow, N_FINE_ROWS-1));
      eRow = Math.max(sRow+1, Math.min(eRow, N_FINE_ROWS));
      return { ev, idx, sRow, eRow };
    }).sort((a,b)=>a.sRow-b.sRow);

    const covered = new Array(N_FINE_ROWS).fill(false);
    placed.forEach(p=>{ for(let r=p.sRow; r<p.eRow; r++){ covered[r]=true; } });
    const isBlockCovered = (b)=>{
      for(let r=FINE_BLOCK_START[b]; r<FINE_BLOCK_END[b]; r++){ if(covered[r]) return true; }
      return false;
    };

    placed.forEach(p=>{
      const div = buildGridEventEl(day, kid, p.ev, p.idx, p.sRow, p.eRow);
      div.style.gridColumn = String(colNum);
      div.style.gridRow = `${p.sRow+2} / ${p.eRow+2}`;
      wrap.appendChild(div);
    });

    for(let b=0; b<FINE_BLOCK_START.length; b++){
      if(isBlockCovered(b)) continue;
      const blockStart = FINE_BLOCK_START[b], blockEnd = FINE_BLOCK_END[b];
      const cell = document.createElement('div');
      cell.className = 'tg-cell-empty';
      cell.style.gridColumn = String(colNum);
      cell.style.gridRow = `${blockStart+2} / ${blockEnd+2}`;
      if(editMode){
        cell.title = '더블클릭해서 일정 추가';
        cell.addEventListener('dblclick', ()=>{
          let boundary = N_FINE_ROWS;
          for(let bb=b+1; bb<FINE_BLOCK_START.length; bb++){ if(isBlockCovered(bb)){ boundary=FINE_BLOCK_START[bb]; break; } }
          const eRowNew = Math.min(blockEnd, boundary);
          info.events.push({cat:'other', time: joinTime(fineLabel(blockStart), fineLabel(eRowNew)), name:'', meta:''});
          markDirty('data');
          const newIdx = info.events.length - 1;
          renderPanels();
          requestAnimationFrame(()=>{
            const el = document.querySelector(`.tg-event[data-day="${day}"][data-kid="${kid}"][data-idx="${newIdx}"] .name`);
            if(el){ el.contentEditable='true'; el.focus(); placeCaretAtEnd(el); }
          });
        });
      }
      wrap.appendChild(cell);
    }
  });

  for(let b=0; b<FINE_BLOCK_START.length; b++){
    const cell = document.createElement('div');
    cell.className = 'time-col-cell';
    cell.textContent = POINT_LABELS[b];
    cell.style.gridColumn = '1';
    cell.style.gridRow = `${FINE_BLOCK_START[b]+2} / ${FINE_BLOCK_END[b]+2}`;
    wrap.appendChild(cell);
  }

  return wrap;
}

function buildGridEventEl(day, kid, ev, idx, sRow, eRow){

  div.style.background = cat.color;
  div.style.color = textColorFor(cat.color);

  div.dataset.idx = idx;

  if(editMode){
    div.appendChild(makeDeleteButton(`"${ev.name || '이 일정'}"을 삭제할까요?`, ()=>{
      DATA[day][kid].events.splice(idx,1);
      markDirty('data');
      renderPanels();
    }));

    const handleTop = document.createElement('div');
    handleTop.className = 'tg-handle tg-handle-top';
    handleTop.title = '드래그해서 시작 시간 조절';
    handleTop.addEventListener('pointerdown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      startDrag(e.clientY, 'resize-top', day, kid, idx, sRow, eRow);
    });
    div.appendChild(handleTop);

    const handleBottom = document.createElement('div');
    handleBottom.className = 'tg-handle tg-handle-bottom';
    handleBottom.title = '드래그해서 종료 시간 조절';
    handleBottom.addEventListener('pointerdown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      startDrag(e.clientY, 'resize', day, kid, idx, sRow, eRow);
    });
    div.appendChild(handleBottom);

    /* 몸통을 길게 누르면(롱프레스) 전체 이동 드래그 시작 — 핸들/삭제버튼/편집 가능한 텍스트는 제외 */
    let pressTimer = null, pStartX = 0, pStartY = 0;
    const THRESHOLD = 380, TOLERANCE = 8;
    const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
    div.addEventListener('pointerdown', (e)=>{
      if(e.target.closest('.tg-handle, .del-x, .ed-field, .cat-dot')) return;
      pStartX = e.clientX; pStartY = e.clientY;
      cancelPress();
      pressTimer = setTimeout(()=>{
        pressTimer = null;
        div.classList.add('dragging');
        startDrag(pStartY, 'move', day, kid, idx, sRow, eRow);
      }, THRESHOLD);
    });
    div.addEventListener('pointermove', (e)=>{
      if(!pressTimer) return;
      if(Math.abs(e.clientX-pStartX)>TOLERANCE || Math.abs(e.clientY-pStartY)>TOLERANCE) cancelPress();
    });
    div.addEventListener('pointerup', cancelPress);
    div.addEventListener('pointerleave', cancelPress);
    div.addEventListener('pointercancel', cancelPress);
  }

  const head = document.createElement('div');
  head.className = 'tg-event-head';
  if(editMode){
    const catDot = document.createElement('span');
    catDot.className = 'cat-dot';
    catDot.title = '카테고리 선택';
    catDot.style.background = cat.color;
    catDot.addEventListener('pointerdown', (e)=> e.stopPropagation());
    catDot.addEventListener('click', (e)=>{
      e.stopPropagation();
      openCategoryPicker(catDot, ev.cat, (newId)=>{
        ev.cat = newId;
        ev.name = getCategory(newId).label;
        markDirty('data');
        renderPanels();
      });
    });
    head.appendChild(catDot);
  }
  const timeLabel = document.createElement('span');
  timeLabel.className = 'time ed-field';
  timeLabel.setAttribute('data-placeholder', '시간');
  const fallbackTimeLabel = `${fineLabel(sRow)} ~ ${fineLabel(Math.min(eRow, N_FINE_ROWS))}`;
  timeLabel.textContent = ev.time || fallbackTimeLabel;
  timeLabel.addEventListener('dblclick', (e)=>{
    if(!editMode) return;
    e.stopPropagation();
    timeLabel.contentEditable = 'true';
    timeLabel.focus();
    placeCaretAtEnd(timeLabel);
  });
  timeLabel.addEventListener('blur', ()=>{
    timeLabel.contentEditable = 'false';
    const val = timeLabel.textContent.trim();
    if(val === ev.time) return;
    ev.time = val;
    markDirty('data');
    renderPanels();
  });
  timeLabel.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); timeLabel.blur(); }
    else if(e.key==='Escape'){ e.preventDefault(); timeLabel.textContent = ev.time || fallbackTimeLabel; timeLabel.blur(); }
  });
  head.appendChild(timeLabel);
  div.appendChild(head);

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = ev.name;
  makeDblClickEditable(name, '이름', (val)=>{ ev.name = val; markDirty('data'); });
  div.appendChild(name);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = ev.meta;
  makeDblClickEditable(meta, '메모', (val)=>{ ev.meta = val; markDirty('data'); });
  div.appendChild(meta);

  return div;
}

function startDrag(startY, mode, day, kid, idx, sRow, eRow){
  const info = DATA[day][kid];
  const duration = eRow - sRow;

  let prevEnd = 0, nextStart = N_FINE_ROWS;
  info.events.forEach((ev2, i2)=>{
    if(i2 === idx) return;
    const rng = parseTimeRange(ev2);
    if(!rng) return;
    let s2 = fineSnap(rng[0]), e2 = fineSnap(rng[1]);
    if(e2 <= s2) e2 = s2 + 1;
    if(e2 <= sRow && e2 > prevEnd) prevEnd = e2;
    if(s2 >= eRow && s2 < nextStart) nextStart = s2;
  });

  const startPx = fineRowToPx(sRow);
  const endPx = fineRowToPx(eRow);
  let previewS = sRow, previewE = eRow;
  const el = document.querySelector(`.tg-event[data-day="${day}"][data-kid="${kid}"][data-idx="${idx}"]`);
  if(el) el.style.touchAction = 'none';

  const onMove = (ev2)=>{
    const deltaPx = ev2.clientY - startY;
    if(mode === 'move'){
      const rawS = Math.round(pxToFineRow(startPx + deltaPx));
      previewS = clamp(rawS, prevEnd, nextStart - duration);
      previewE = previewS + duration;
    } else if(mode === 'resize-top'){
      const rawS = Math.round(pxToFineRow(startPx + deltaPx));
      previewS = clamp(rawS, prevEnd, eRow - 1);
      previewE = eRow;
    } else {
      const rawE = Math.round(pxToFineRow(endPx + deltaPx));
      previewE = clamp(rawE, sRow + 1, nextStart);
      previewS = sRow;
    }
    if(el) el.style.gridRow = `${previewS+2} / ${previewE+2}`;
  };
  const onUp = ()=>{
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    info.events[idx].time = joinTime(fineLabel(previewS), fineLabel(Math.min(previewE, N_FINE_ROWS)));
    markDirty('data');
    renderPanels();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

function mondayOf(date){
  const dt = new Date(date);
  const day = dt.getDay();
  const diff = day===0 ? -6 : 1-day;
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  const y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,'0'), d=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function normalizeSnapshots(){
  if(!SNAPSHOTS) SNAPSHOTS = deepClone(DEFAULT_SNAPSHOTS);
  if(!Array.isArray(SNAPSHOTS.items)) SNAPSHOTS.items = [];
}
function normalizeHomework(){
  if(!HOMEWORK) HOMEWORK = deepClone(DEFAULT_HOMEWORK);
  if(!Array.isArray(HOMEWORK.items)) HOMEWORK.items = [];
  HOMEWORK.items.forEach(it=>{
    if(!it.day) it.day = '월';
    if(!KIDS.includes(it.kid)) it.kid = KIDS[0];
    if(typeof it.mark !== 'number') it.mark = it.done ? 2 : 0;
  });
}
function ensureHomeworkWeek(){
  normalizeHomework();
  const cur = mondayOf(new Date());
  if(HOMEWORK.weekOf !== cur){
    HOMEWORK.weekOf = cur;
    HOMEWORK.items.forEach(it=> it.mark=0);
    markDirty('homework');
  }
}

function buildHomeworkItem(item, idx){
  const row = document.createElement('div');

  check.className = 'hw-check' + (item.mark>=1 ? ' checked' : '');

  check.title = '눌러서 체크 → 취소선 → 초기화';

}

          let sRow, eRow;
          if(rng){ sRow = snapStart(rng[0]); eRow = snapEnd(rng[1]); }
          else { sRow = nextFree; eRow = nextFree + 2; }
          sRow = Math.max(sRow, nextFree);
          if(eRow <= sRow) eRow = sRow + 1;
          eRow = Math.min(eRow, N_ROWS);
          nextFree = eRow;

          const r0 = HEADER_ROWS + 1 + sRow;
          const r1 = HEADER_ROWS + Math.max(sRow, eRow - 1) + 1;
          if(r1 > r0){ ws.mergeCells(r0, colI, r1, colI); }

          const lines = [];
          if(ev.name) lines.push(ev.name);
          if(ev.time) lines.push(ev.time);
          if(ev.meta) lines.push(ev.meta);

          const cat = getCategory(ev.cat);
          const bg = cat.color.replace('#','');
          const tx = textColorFor(cat.color).replace('#','');
          const cell = ws.getCell(r0, colI);
          cell.value = lines.join('\n');
          cell.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
          cell.fill = fill(bg);
          cell.font = { name:'Arial', size:9, bold:true, color:{argb:'FF'+tx} };
          for(let rr=r0; rr<=r1; rr++){ ws.getCell(rr, colI).border = borderAll; }
        });
      });
    });

    const ws2 = wb.addWorksheet('연락처/학원비');
    ws2.getColumn(1).width = 20;
    ws2.getColumn(2).width = 16;
    ws2.getColumn(3).width = 16;
    ws2.getColumn(4).width = 10;
    ws2.getColumn(5).width = 24;
    ws2.getColumn(6).width = 12;
    ws2.getColumn(7).width = 8;

    let r2 = 1;
    ws2.mergeCells(r2,1,r2,3);
    {
      const cell = ws2.getCell(r2,1);
      cell.value = '연락처';
      cell.font = { name:'Arial', bold:true, size:13 };
      cell.fill = fill('D9D2BF');
      cell.alignment = { vertical:'middle' };
      [1,2,3].forEach(c=> ws2.getCell(r2,c).border = borderAll);
    }
    r2++;
    ['이름','구분','전화번호'].forEach((label,i)=>{
      const cell = ws2.getCell(r2, i+1);
      cell.value = label;
      cell.font = { name:'Arial', bold:true, size:10 };
      cell.fill = fill('EDE7D6');
      cell.border = borderAll;
      cell.alignment = { horizontal:'center', vertical:'middle' };
    });
    r2++;
    CONTACTS.rows.forEach(row=>{
      [row.academy, row.role, row.phone].forEach((val,i)=>{
        const cell = ws2.getCell(r2, i+1);
        cell.value = val || '';
        cell.font = { name:'Arial', size:10 };
        cell.border = borderAll;
        cell.alignment = { vertical:'middle' };
      });
      r2++;
    });
    r2 += 1;

    ws2.mergeCells(r2,1,r2,FEE_COLS.length);
    {
      const cell = ws2.getCell(r2,1);
      cell.value = '학원비';
      cell.font = { name:'Arial', bold:true, size:13 };
      cell.fill = fill('D9D2BF');
      cell.alignment = { vertical:'middle' };
      for(let c=1;c<=FEE_COLS.length;c++) ws2.getCell(r2,c).border = borderAll;
    }
    r2++;

    FEES.groups.forEach(group=>{
      FEE_COLS.forEach((c,i)=>{
        const cell = ws2.getCell(r2, i+1);
        cell.value = c.label;
        cell.font = { name:'Arial', bold:true, size:10 };
        cell.fill = fill('EDE7D6');
        cell.border = borderAll;
        cell.alignment = { horizontal:'center', vertical:'middle' };
      });
      r2++;
      group.rows.forEach(row=>{
        FEE_COLS.forEach((c,i)=>{
          const cell = ws2.getCell(r2, i+1);
          cell.value = row[c.key] || '';
          cell.font = { name:'Arial', size:10 };
          cell.border = borderAll;
          cell.alignment = { vertical:'middle' };
        });
        r2++;
      });
      ws2.mergeCells(r2,1,r2,2);
      const totalLabelCell = ws2.getCell(r2,1);
      totalLabelCell.value = '합계';
      totalLabelCell.font = { name:'Arial', bold:true, size:10 };
      totalLabelCell.fill = fill('FAF6EB');
      [1,2].forEach(c=> ws2.getCell(r2,c).border = borderAll);
      const totalAmtCell = ws2.getCell(r2,3);
      totalAmtCell.value = calcGroupTotal(group);
      totalAmtCell.font = { name:'Arial', bold:true, size:10 };
      totalAmtCell.fill = fill('FAF6EB');
      totalAmtCell.border = borderAll;
      for(let c=4;c<=FEE_COLS.length;c++){
        ws2.getCell(r2,c).fill = fill('FAF6EB');
        ws2.getCell(r2,c).border = borderAll;
      }
      r2 += 2;
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '자녀일정표.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('엑셀 파일로 내보냈어요');
  }catch(e){
    console.error('엑셀 내보내기 오류:', e);
    showToast('엑셀 내보내기에 실패했어요');
  }finally{
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}

  editMode = !editMode;

function formatSnapDate(iso){
  try{
    const d = new Date(iso);
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day} ${hh}:${mm} 저장`;
  }catch(e){ return ''; }
}
function applySnapshot(snap){
  DATA = deepClone(snap.data);
  CONTACTS = deepClone(snap.contacts);
  FEES = deepClone(snap.fees);
  CATEGORIES = deepClone(snap.categories);
  HOMEWORK = deepClone(snap.homework);
  ensureHomeworkWeek();
  if(snap.titleInfo){
    TITLE = snap.titleInfo.title || DEFAULT_TITLE;
    SUBTITLE = snap.titleInfo.subtitle || DEFAULT_SUBTITLE;
    YEAR = snap.titleInfo.year || DEFAULT_YEAR;
    TERM = TERM_OPTIONS.includes(snap.titleInfo.term) ? snap.titleInfo.term : DEFAULT_TERM;
  }
  markDirty('data'); markDirty('contacts'); markDirty('fees');
  markDirty('categories'); markDirty('homework'); markDirty('title');
  rerenderNow();
  showToast(`"${snap.title}" 일정을 불러왔어요`);
}
function renderSnapshotList(){
  normalizeSnapshots();
  const listEl = document.getElementById('snapshotList');
  listEl.innerHTML = '';
  if(SNAPSHOTS.items.length === 0){
    const empty = document.createElement('div');
    empty.className = 'snap-empty';
    empty.textContent = '저장된 일정이 없어요. "📌 일정 fix" 버튼으로 지금 일정을 저장해보세요.';
    listEl.appendChild(empty);
    return;
  }
  SNAPSHOTS.items.slice().reverse().forEach(snap=>{
    const realIdx = SNAPSHOTS.items.indexOf(snap);
    const row = document.createElement('div');
    row.className = 'snap-item';

    const info = document.createElement('div');
    info.className = 'snap-info';
    const title = document.createElement('div');
    title.className = 'snap-title';
    title.textContent = snap.title;
    const date = document.createElement('div');
    date.className = 'snap-date';
    date.textContent = formatSnapDate(snap.savedAt);
    info.appendChild(title);
    info.appendChild(date);
    row.appendChild(info);

    const loadBtn = document.createElement('button');
    loadBtn.type = 'button';
    loadBtn.className = 'snap-load-btn';
    loadBtn.textContent = '불러오기';
    loadBtn.addEventListener('click', ()=>{
      if(!confirm(`"${snap.title}" 일정을 불러올까요? 현재 화면의 내용은 덮어써집니다.`)) return;
      applySnapshot(snap);
      document.getElementById('snapshotModal').style.display = 'none';
    });
    row.appendChild(loadBtn);
    row.appendChild(makeDeleteButton(`"${snap.title}" 저장본을 삭제할까요?`, ()=>{
      SNAPSHOTS.items.splice(realIdx,1);
      markDirty('snapshots');
      renderSnapshotList();
    }));
    listEl.appendChild(row);
  });
}

document.getElementById('fixBtn').addEventListener('click', ()=>{
  normalizeSnapshots();
  const title = prompt('저장할 일정 이름을 입력하세요 (예: 2026년 1학기)', TITLE || '');
  if(title === null) return;
  const trimmed = title.trim();
  if(!trimmed){ showToast('이름을 입력해주세요'); return; }
  const snap = {
    id: 'snap' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    title: trimmed,
    savedAt: new Date().toISOString(),
    data: deepClone(DATA),
    contacts: deepClone(CONTACTS),
    fees: deepClone(FEES),
    categories: deepClone(CATEGORIES),
    homework: deepClone(HOMEWORK),
    titleInfo: { title:TITLE, subtitle:SUBTITLE, year:YEAR, term:TERM }
  };
  SNAPSHOTS.items.push(snap);
  markDirty('snapshots');
  showToast(`"${trimmed}" 이름으로 저장했어요`);
});

document.getElementById('viewSnapshotsBtn').addEventListener('click', ()=>{
  renderSnapshotList();
  document.getElementById('snapshotModal').style.display = 'flex';
});
document.getElementById('snapshotCloseBtn').addEventListener('click', ()=>{
  document.getElementById('snapshotModal').style.display = 'none';
});
document.getElementById('snapshotModal').addEventListener('click', (e)=>{
  if(e.target.id === 'snapshotModal') document.getElementById('snapshotModal').style.display = 'none';
});

async function startApp(){
  if(appStarted) return;
  appStarted = true;
  await loadLocalState();
  ensureHomeworkWeek();
  normalizeSnapshots();
  applyTitleToDOM();
  initStaticEditables();
  buildTabs();
  buildLegend();
  renderPanels();
  renderHomework();
  fbInit();
}
function stopApp(){
  appStarted = false;
  if(fbRef){ fbRef.off(); fbRef = null; }
  fbStatus = 'connecting';
}

/* ===== 로그인 ===== */
try{ firebase.initializeApp(firebaseConfig); }catch(e){ console.error(e); }

const loginOverlay = document.getElementById('loginOverlay');
const appRoot = document.getElementById('appRoot');
const loginForm = document.getElementById('loginForm');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginError = document.getElementById('loginError');
const loginSubmitBtn = document.getElementById('loginSubmitBtn');
const logoutBtn = document.getElementById('logoutBtn');

/* 리스너를 먼저 붙여서, 아래 인증 초기화가 실패해도 버튼이 "먹통"이 되지 않고
   눌렀을 때 화면에 오류가 뜨도록 한다. */
loginForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  loginError.textContent = '';
  loginSubmitBtn.disabled = true;
  try{
    firebase.auth().signInWithEmailAndPassword(loginEmail.value.trim(), loginPassword.value)
      .catch((err)=>{
        console.error('login error', err);
        const friendly = {
          'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않아요.',
          'auth/wrong-password': '이메일 또는 비밀번호가 올바르지 않아요.',
          'auth/user-not-found': '이메일 또는 비밀번호가 올바르지 않아요.',
          'auth/invalid-email': '이메일 형식이 올바르지 않아요.',
          'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 시도해주세요.',
          'auth/network-request-failed': '네트워크 연결을 확인해주세요.'
        };
        loginError.textContent = friendly[err.code] || `로그인 실패 (${err.code || 'unknown'}): ${err.message || err}`;
      })
      .finally(()=>{ loginSubmitBtn.disabled = false; });
  }catch(err){
    console.error('login call error', err);
    loginError.textContent = `로그인 오류: ${err.message || err}`;
    loginSubmitBtn.disabled = false;
  }
});

logoutBtn.addEventListener('click', ()=>{
  try{ firebase.auth().signOut(); }catch(err){ console.error('signOut error', err); }
});

async function initAuth(){
  try{
    await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  }catch(err){
    console.error('persistence LOCAL failed, falling back to NONE', err);
    try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); }
    catch(err2){ console.error('persistence NONE also failed', err2); }
  }
  try{
    firebase.auth().onAuthStateChanged((user)=>{
      if(user){
        loginOverlay.style.display = 'none';
        appRoot.style.display = '';
        loginError.textContent = '';
        loginForm.reset();
        startApp();
      } else {
        loginOverlay.style.display = 'flex';
        appRoot.style.display = 'none';
        stopApp();
      }
    });
  }catch(err){
    console.error('auth init error', err);
    loginError.textContent = `로그인 기능을 초기화하지 못했어요: ${err.message || err}`;
  }
}
initAuth();
